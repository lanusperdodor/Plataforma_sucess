<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#17191B" />
    <script src="/theme-init.js"></script>
    <meta name="description" content="Tucaí — Tudo junto. Tudo aí. Comida, lojas, serviços, vagas e comunidade da sua cidade." />
    <meta name="application-name" content="Tucaí" />
    <meta property="og:title" content="Tucaí — Tudo junto. Tudo aí." />
    <meta property="og:site_name" content="Tucaí" />
    <meta property="og:image" content="https://plataforma-sucess.marcossonopi.workers.dev/brand/og-tucai.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/icone-1024.png" />
    <!-- o PNG do Tuca só aparece com "reduzir movimento"; os demais veem o vídeo -->
    <link rel="preload" as="image" href="/brand/tuca-apresentador-600.png" media="(prefers-reduced-motion: reduce)" />
    <link rel="stylesheet" href="/boot.css" />
    <title>Tucaí — Tudo junto. Tudo aí.</title>
  </head>
  <body>
    <!-- Conteúdo inicial substituído pelo React. Se o app não iniciar, o aviso abaixo aparece em vez de uma tela branca. -->
    <div id="root">
      <div id="boot">
        <div class="boot-box">
          <img src="/brand/icone.svg" alt="" width="56" height="56" class="boot-icon" />
          <p id="boot-msg">Carregando o Tucaí…</p>
          <button id="boot-retry" type="button" hidden>Recarregar</button>
        </div>
      </div>
    </div>
    <script src="/boot-guard.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
